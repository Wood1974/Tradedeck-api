name: Apply Shield Migrations to Supabase

on:
  workflow_dispatch:
    inputs:
      supabase_service_key:
        description: 'Supabase service role key for jlaajejpqjldpbinktln'
        required: false
        type: string

env:
  SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || inputs.supabase_service_key }}

jobs:
  apply-migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Supabase client
        run: pip install supabase

      - name: Apply Migration 1 - Base Schema & RLS
        run: python3 .github/scripts/apply_migration.py supabase/migrations/20260914000000_shield_schema_and_rls.sql

      - name: Apply Migration 2 - Hardening
        run: python3 .github/scripts/apply_migration.py supabase/migrations/20260914010000_shield_hardening.sql

      - name: Apply Migration 3 - Field Notes
        run: python3 .github/scripts/apply_migration.py supabase/migrations/20260914020000_shield_field_notes.sql

      - name: Apply Migration 4 - Retake Index
        run: python3 .github/scripts/apply_migration.py supabase/migrations/20260914030000_shield_retake_index.sql

      - name: Apply Migration 5 - RLS Security Fixes
        run: python3 .github/scripts/apply_migration.py supabase/migrations/20260928000000_rls_close_privilege_escalation.sql

      - name: Verify Migrations
        run: python3 .github/scripts/verify_migrations.py
