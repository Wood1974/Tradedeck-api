name: Apply Shield Migrations to Supabase

# Manual only. Committing a migration file does NOT apply it.
#
# The service role key comes from the repository secret SUPABASE_SERVICE_KEY and
# nowhere else. It is passed through `env:` and read with os.environ -- never
# interpolated into a run block with ${{ }}.
#
# This workflow previously accepted the key as a workflow_dispatch string input
# and inlined it into the Python heredoc. Both were unsafe: workflow_dispatch
# string inputs are not masked, so the value was visible in the run's parameters
# to anyone with Actions read access, and ${{ }} interpolation into a run block
# is a script-injection vector that also exposes the value to the runner's
# process list. If that input was ever used, treat the key as exposed and
# rotate it in the Supabase dashboard.

on:
  workflow_dispatch:

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jlaajejpqjldpbinktln.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Supabase client
        run: pip install supabase

      - name: Check the service key is configured
        run: |
          if [ -z "${SUPABASE_SERVICE_KEY}" ]; then
            echo "::error::Repository secret SUPABASE_SERVICE_KEY is not set. Add it in Settings > Secrets and variables > Actions. Do not pass it as a workflow input." >&2
            exit 1
          fi

      - name: Apply migrations
        run: python3 .github/scripts/apply_migrations.py

      - name: Verify Shield tables
        run: python3 .github/scripts/apply_migrations.py --verify-only
