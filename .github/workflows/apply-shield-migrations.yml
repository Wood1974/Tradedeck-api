name: Apply Shield Migrations to Supabase

on:
  workflow_dispatch:

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Supabase client
        run: pip install supabase
      
      - name: Apply Migration 1 - Base Schema & RLS
        run: python3 << 'PYTHON'
import subprocess
from supabase import create_client

SUPABASE_URL = "https://jlaajejpqjldpbinktln.supabase.co"
SERVICE_KEY = "${{ secrets.SUPABASE_SERVICE_KEY }}"

client = create_client(SUPABASE_URL, SERVICE_KEY)

with open('supabase/migrations/20260914000000_shield_schema_and_rls.sql', 'r') as f:
    sql = f.read()

try:
    result = client.rpc('execute_sql', {'sql': sql}).execute()
    print("✓ Migration 1 applied successfully")
except Exception as e:
    print(f"✗ Migration 1 failed: {e}")
    exit(1)
PYTHON
      
