name: Shield Android build

# The first compiler the Android client meets, when this job runs.
#
# What this proves: the sources compile into a debug APK. What it does not:
# that the app runs, that Key Attestation or Play Integrity works on a device,
# or that the server accepts what the device sends. Nothing here is installed
# on a phone.

on:
  push:
    paths: ['shield/android/**', '.github/workflows/shield-android.yml']
  pull_request:
    paths: ['shield/android/**', '.github/workflows/shield-android.yml']
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the platform this project compiles against
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile the debug APK
        working-directory: shield/android
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
