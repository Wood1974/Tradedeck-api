services:
  - type: web
    name: tradedeck-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: draw-photos
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERMITSTACK_KEY
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: ZIPRECRUITER_KEY
        sync: false
      - key: APP_URL
        value: https://tradedeckapp.com
      - key: DB_PATH
        value: /var/data/tradedeck-leads.db
    disk:
      name: tradedeck-leads
      mountPath: /var/data
      sizeGB: 1
