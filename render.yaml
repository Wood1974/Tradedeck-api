services:
  - type: web
    name: tradedeck-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Owner-only test mode for the Shield ID check (see identity_api.py). Both are optional; unset means every
      # account runs live. STRIPE_TEST_SECRET_KEY must be an sk_test_ / rk_test_ key.
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: IDENTITY_TEST_MODE_USER_IDS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        value: https://tradedeckapp.com
      # Includes the Shield phone app's own origins (iOS capacitor://localhost, Android https://localhost).
      - key: ALLOWED_ORIGINS
        value: https://tradedeckapp.com,capacitor://localhost,https://localhost
